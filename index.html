function shuffle(a,seed){const r=rnd(seed||11),b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=b[i];b[i]=b[j];b[j]=t;}return b;}
function insertAt(ta,text){
  const s=ta.selectionStart==null?ta.value.length:ta.selectionStart,e=ta.selectionEnd==null?s:ta.selectionEnd;
  const pre=ta.value.slice(0,s),post=ta.value.slice(e);
  const sp=pre&&!/\s$/.test(pre)?' ':'';
  ta.value=pre+sp+text+' '+post;
  const p=(pre+sp+text+' ').length;
  try{ta.setSelectionRange(p,p);}catch(err){}
  ta.dispatchEvent(new Event('input'));
}
const strip=t=>String(t).replace(/[^\w'’-]/g,'');

/* ---------- step types ---------- */
const T={};

T.pick=(s,ctx)=>{
  const marker=s.marker||'color',sel=new Set(),nodes=[];let tries=0,locked=false;
  const wrap=h('div',{class:'picks '+(s.mode==='sentence'?'sentence':'tiles')});
  const fb=h('div',{class:'fb',role:'status','aria-live':'polite'});
  function mk(it,key){
    const b=h('button',{type:'button',class:'tok m-'+marker,'aria-pressed':'false'},it.t);
    b.onclick=()=>{
      if(locked)return;
      if(sel.has(key))sel.delete(key);else sel.add(key);
      b.classList.remove('good','bad','miss');
      b.classList.toggle('on',sel.has(key));
      b.setAttribute('aria-pressed',sel.has(key)?'true':'false');
    };
    nodes.push({key,it,b});return b;
  }
  s.items.forEach((it,i)=>{
    if(it.parts){const g=h('span',{class:'wordgroup'});it.parts.forEach((p,j)=>g.append(mk(p,i+'-'+j)));wrap.append(g);}
    else wrap.append(mk(it,String(i)));
  });
  function check(){
    if(locked)return;tries++;
    const bad=[],miss=[];
    nodes.forEach(({key,it,b})=>{
      const on=sel.has(key);b.classList.remove('good','bad','miss');
      if(it.opt)return;
      if(on&&it.ok)b.classList.add('good');
      else if(on&&!it.ok){b.classList.add('bad');bad.push(it);}
      else if(!on&&it.ok){b.classList.add('miss');miss.push(it);}
    });
    ctx.log('check',{correct:!bad.length&&!miss.length,text:'picked: '+nodes.filter(n=>sel.has(n.key)).map(n=>strip(n.it.t)).join(', ')+(miss.length?' | missed: '+miss.map(m=>strip(m.t)).join(', '):'')});
    fb.innerHTML='';
    if(!bad.length&&!miss.length){
      locked=true;fb.className='fb ok';fb.append('✓ Yes! You found every one.');
      if(s.explain)fb.append(h('div',{class:'why',html:s.explain}));
      ctx.done(tries<=2?1:0);
    }else{
      fb.className='fb try';
      fb.append('↻ Not yet. '+(bad.length?'Take back '+bad.length+' (orange). ':'')+(miss.length?miss.length+' still to find (dashed outline).':''));
      (tries>=2?bad.concat(miss):bad).forEach(it=>{if(it.why)fb.append(h('div',{class:'why'},'“'+strip(it.t)+'”: '+it.why));});
    }
  }
  function reveal(){
    locked=true;fb.className='fb ok';fb.innerHTML='Here are the answers:';
    nodes.forEach(({key,it,b})=>{
      b.classList.remove('good','bad','miss','on');
      if(it.ok){b.classList.add('good');if(it.why)fb.append(h('div',{class:'why'},'“'+strip(it.t)+'”: '+it.why));}
    });
  }
  const el=h('div',null,wrap,h('div',{class:'actions'},h('button',{class:'btn primary',type:'button',onclick:check},'Check my answer')),fb);
  return{el,reveal};
};

T.match=(s,ctx)=>{
  const n=s.pairs.length;
  const L=s.pairs.map((p,i)=>({t:p[0],i}));
  const R=shuffle(s.pairs.map((p,i)=>({t:p[1],i})),n*7+3);
  let sel=null,matched=0,miss=0;
  const fb=h('div',{class:'fb',role:'status','aria-live':'polite'});
  const cl=h('div',{class:'col'}),cr=h('div',{class:'col'});
  const all=[];
  function lock(a,b,i){
    [a,b].forEach(x=>{x.classList.add('ok');x.disabled=true;x.append(h('span',{class:'bdg'},String.fromCharCode(65+i)));});
  }
  function pick(b,o,side){
    if(b.classList.contains('ok'))return;
    if(sel&&sel.side!==side){
      const a=sel;sel=null;a.b.classList.remove('on');
      if(a.o.i===o.i){
        ctx.log('match',{correct:true,text:(side==='R'?a.o.t+' | '+o.t:o.t+' | '+a.o.t)});
        lock(a.b,b,o.i);matched++;fb.className='fb ok';fb.textContent='✓ Match!';
        if(matched===n){fb.textContent='✓ All matched!';ctx.done(miss<=2?1:0);}
      }else{
        ctx.log('match',{correct:false,text:(side==='R'?a.o.t+' | '+o.t:o.t+' | '+a.o.t)});
        miss++;fb.className='fb try';fb.textContent='↻ Not a match. Try another one.';
        [a.b,b].forEach(x=>{x.classList.add('bad');setTimeout(()=>x.classList.remove('bad'),900);});
      }
      return;
    }
    if(sel){sel.b.classList.remove('on');if(sel.b===b){sel=null;return;}}
    sel={b,o,side};b.classList.add('on');
  }
  function mkb(o,side){const b=h('button',{type:'button',class:'tok mt'},o.t);b.onclick=()=>pick(b,o,side);b._i=o.i;b._side=side;all.push(b);return b;}
  L.forEach(o=>cl.append(mkb(o,'L')));R.forEach(o=>cr.append(mkb(o,'R')));
  function reveal(){
    all.forEach(b=>{if(!b.classList.contains('ok')&&b._side==='L'){const m=all.find(x=>x._side==='R'&&x._i===b._i);lock(b,m,b._i);}});
    fb.className='fb ok';fb.textContent='Here are the matches.';
  }
  return{el:h('div',null,h('p',{class:'sub'},'Tap one on the left, then its match on the right.'),h('div',{class:'grid2'},cl,cr),fb),reveal};
};

T.choice=(s,ctx)=>{
  const rows=s.rows;let solved=0,wrong=0;
  const wrap=h('div',{class:'rows'});const R=[];
  rows.forEach((r,ri)=>{
    const multi=Array.isArray(r.a);
    const stem=h('p',{class:'stem',html:(r.stem||'').replace('___','<span class="blank">______</span>')});
    const opts=h('div',{class:'opts'});const fb=h('div',{class:'rowfb',role:'status','aria-live':'polite'});
    const card=h('div',{class:'row'});
    const st={ok:false,sel:new Set(),bs:[],stem,fb,card};
    r.options.forEach((o,k)=>{
      const b=h('button',{type:'button',class:'tok opt','aria-pressed':'false',html:o});
      b.onclick=()=>{
        if(st.ok)return;
        if(multi){if(st.sel.has(k))st.sel.delete(k);else st.sel.add(k);b.classList.toggle('on',st.sel.has(k));b.setAttribute('aria-pressed',st.sel.has(k)?'true':'false');return;}
        ctx.log('answer',{correct:k===r.a,text:'row '+(ri+1)+': '+plain(r.stem||'')+' => '+plain(o)});
        if(k===r.a)solveRow(st,r);
        else{wrong++;b.classList.add('bad');b.disabled=true;fb.className='rowfb';fb.textContent='↻ Not this one. '+(r.hint||'Try another.');}
      };
      st.bs.push(b);opts.append(b);
    });
    const kids=[h('div',{class:'qrow'},stem,say(r.stem||r.options.join(', ')))];
    kids.push(opts);
    if(multi){
      kids.push(h('div',{class:'actions'},h('button',{class:'btn small',type:'button',onclick:()=>{
        if(st.ok)return;const a=new Set(r.a);
        const same=a.size===st.sel.size&&[...a].every(x=>st.sel.has(x));
        ctx.log('answer',{correct:same,text:'row '+(ri+1)+': '+[...st.sel].map(k=>plain(r.options[k])).join(' | ')});
        if(same)solveRow(st,r);else{wrong++;fb.className='rowfb';fb.textContent='↻ Not quite. '+(r.hint||'Check each choice again — which ones does the text really support?');}
      }},'Check')));
    }
    kids.push(fb);card.append(...kids);wrap.append(card);R.push(st);
  });
  function solveRow(st,r,reveal){
    if(st.ok)return;st.ok=true;
    const ans=Array.isArray(r.a)?r.a:[r.a];
    st.bs.forEach((b,k)=>{b.disabled=true;b.classList.remove('bad','on');if(ans.includes(k))b.classList.add('good');});
    if(!Array.isArray(r.a)){const bl=st.stem.querySelector('.blank');if(bl&&r.fill!==false)bl.textContent=plain(r.options[r.a]);}
    st.fb.className='rowfb';st.fb.textContent=(reveal?'Answer: ':'✓ ')+(r.why||'Correct!');
    st.card.classList.add('solved');
    solved++;
    if(solved===rows.length&&!reveal)ctx.done(wrong<=Math.floor(rows.length/2)?1:0);
  }
  function reveal(){R.forEach((st,i)=>solveRow(st,rows[i],true));}
  return{el:wrap,reveal};
};

T.sort=(s,ctx)=>{
  const items=s.items.map((it,i)=>Object.assign({i,pos:null,locked:false,bad:false},it));
  const B=s.buckets;let selI=null,tries=0;
  const pile=h('div',{class:'pile'}),bw=h('div',{class:'buckets'});
  const fb=h('div',{class:'fb',role:'status','aria-live':'polite'});
  function chip(x){
    const c=h('button',{type:'button',class:'tok chip'+(selI===x.i?' on m-box':'')+(x.locked?' good':'')+(x.bad?' bad':''),html:x.t});
    c.onclick=()=>{if(x.locked)return;selI=(selI===x.i)?null:x.i;draw();};
    return c;
  }
  function place(id){
    if(selI==null){fb.className='fb try';fb.textContent='Tap a card first, then tap the group it belongs in.';return;}
    const x=items[selI];x.pos=id;x.bad=false;selI=null;fb.textContent='';draw();
  }
  function draw(){
    pile.innerHTML='';bw.innerHTML='';
    const un=items.filter(x=>x.pos===null);
    un.forEach(x=>pile.append(chip(x)));
    if(!un.length)pile.append(h('span',{class:'empty'},'All cards are placed. Press Check.'));
    B.forEach(b=>{
      const box=h('div',{class:'bucket'});
      box.append(h('button',{type:'button',class:'bhead',onclick:()=>place(b.id)},(b.icon?b.icon+' ':'')+b.label));
      const list=h('div',{class:'blist'});items.filter(x=>x.pos===b.id).forEach(x=>list.append(chip(x)));
      box.append(list);bw.append(box);
    });
  }
  function check(){
    if(items.some(x=>x.pos===null)){fb.className='fb try';fb.textContent='Place every card first.';return;}
    tries++;const wrong=[];
    items.forEach(x=>{if(x.locked)return;if(x.pos===x.b)x.locked=true;else{wrong.push(x);x.bad=true;x.pos=null;}});
    ctx.log('check',{correct:!wrong.length,text:wrong.length?'misplaced: '+wrong.map(x=>plain(x.t)).join(' | '):'all correct'});
    draw();fb.innerHTML='';
    if(!wrong.length){fb.className='fb ok';fb.textContent='✓ Everything is in the right place!';ctx.done(tries<=2?1:0);}
    else{
      fb.className='fb try';fb.append('↻ '+wrong.length+' card'+(wrong.length>1?'s':'')+' went back to the pile. Try them again.');
      wrong.forEach(x=>{const bl=B.find(b=>b.id===x.b);fb.append(h('div',{class:'why'},'“'+plain(x.t)+'”'+(tries>=2?' goes in “'+bl.label+'”. ':': ')+(x.why||'')));});
    }
  }
  function reveal(){items.forEach(x=>{x.pos=x.b;x.locked=true;x.bad=false;});selI=null;draw();fb.className='fb ok';fb.textContent='Here is the sorted list.';}
  draw();
  const el=h('div',null,h('p',{class:'sub'},'Tap a card, then tap the group name.'),pile,bw,
    h('div',{class:'actions'},h('button',{class:'btn small',type:'button',onclick:()=>place(null)},'↩ Put card back in pile'),h('button',{class:'btn primary',type:'button',onclick:check},'Check my answer')),fb);
  return{el,reveal};
};

T.order=(s,ctx)=>{
  const n=s.items.length;const pos=Array(n).fill(null);let tries=0;const locked=Array(n).fill(false);const bad=Array(n).fill(false);
  const order=shuffle(s.items.map((x,i)=>i),n*5+1);
  const pile=h('div',{class:'pile'}),slots=h('div',{class:'slots'}),fb=h('div',{class:'fb',role:'status','aria-live':'polite'});
  const prev=h('div',{class:'preview',hidden:true});
  const lab=k=>(s.labels&&s.labels[k])||(['1st','2nd','3rd'][k]||(k+1)+'th');
  function who(k){return pos.indexOf(k);}
  function chip(i,inSlot){
    const it=s.items[i];
    const c=h('button',{type:'button',class:'tok'+(locked[i]?' good':'')+(bad[i]?' bad':'')},it.t,it.sub?h('small',null,it.sub):null);
    c.onclick=()=>{
      if(locked[i])return;
      if(inSlot){pos[pos.indexOf(i)]=null;}
      else{const e=pos.indexOf(null);if(e<0)return;pos[e]=i;}
      bad[i]=false;fb.textContent='';draw();
    };
    return c;
  }
  function draw(){
    pile.innerHTML='';slots.innerHTML='';
    order.filter(i=>!pos.includes(i)).forEach(i=>pile.append(chip(i,false)));
    if(!pile.children.length)pile.append(h('span',{class:'empty'},'All cards are placed. Press Check.'));
    for(let k=0;k<n;k++){
      const i=pos[k];
      slots.append(h('div',{class:'slot'},h('span',{class:'slotn'},lab(k)),i==null?h('span',{class:'empty'},'tap a card to put it here'):chip(i,true)));
    }
    if(s.preview){const w=pos.filter(x=>x!=null).map(x=>s.items[x].t);prev.hidden=!w.length;prev.textContent=w.join(' ');}
  }
  function check(){
    if(pos.includes(null)){fb.className='fb try';fb.textContent='Fill every spot first.';return;}
    tries++;let wrong=0;
    for(let k=0;k<n;k++){const i=pos[k];if(i===k)locked[i]=true;else{wrong++;bad[i]=true;}}
    ctx.log('check',{correct:!wrong,text:pos.map(i=>s.items[i].t).join(' > ')});
    if(!wrong){draw();fb.className='fb ok';fb.textContent='✓ Perfect order!'+(s.why?' '+s.why:'');ctx.done(tries<=2?1:0);}
    else{
      for(let k=0;k<n;k++){const i=pos[k];if(i!==k)pos[k]=null;}
      draw();
      fb.className='fb try';fb.textContent='↻ '+wrong+' card'+(wrong>1?'s':'')+' went back to the pile (orange). Try them again.';
    }
  }
  function reveal(){for(let k=0;k<n;k++){pos[k]=k;locked[k]=true;bad[k]=false;}draw();fb.className='fb ok';fb.textContent='Here is the correct order.';}
  draw();
  const el=h('div',null,h('p',{class:'sub'},s.sub||'Tap the cards in order.'),pile,slots,prev,h('div',{class:'actions'},h('button',{class:'btn primary',type:'button',onclick:check},'Check my order')),fb);
  return{el,reveal};
};

T.edit=(s,ctx)=>{
  const toks=s.tokens.map((t,i)=>Object.assign({i,fixed:false},t));
  const total=toks.filter(t=>t.fix!=null).length;let fixed=0,wrong=0,cur=null,misses=0;
  const pass=h('div',{class:'passage'}),panel=h('div',{class:'panel',hidden:true,'aria-live':'polite'}),count=h('div',{class:'count'});
  const fb=h('div',{class:'fb',role:'status','aria-live':'polite'});
  const btns=[];
  function upd(){count.textContent='Mistakes fixed: '+fixed+' of '+total;}
  function done(){
    panel.hidden=true;fb.className='fb ok';fb.innerHTML='';
    fb.append('✓ All fixed! Read your clean copy out loud.');
    const clean=toks.map(t=>t.fix!=null?t.fix:t.t).join(' ');
    fb.append(h('div',{class:'preview'},clean),say(clean));
    ctx.done(wrong<=total?1:0);
  }
  function fix(t){
    t.fixed=true;fixed++;const b=btns[t.i];b.textContent=t.fix;b.className='etok fixed';
    fb.className='fb ok';fb.innerHTML='';fb.append('✓ Fixed. '+(t.why||''));upd();panel.hidden=true;cur=null;
    if(fixed===total)done();
  }
  function open(t){
    btns.forEach(b=>b.classList.remove('sel'));btns[t.i].classList.add('sel');cur=t;
    panel.hidden=false;panel.innerHTML='';fb.textContent='';
    if(t.fix==null){ctx.log('false-alarm',{correct:false,text:t.t});panel.append(h('div',null,'✔ “'+t.t+'” is already correct. Keep looking!'));misses++;return;}
    if(t.fixed){panel.append(h('div',null,'✓ You already fixed this one.'));return;}
    panel.append(h('div',{class:'sub'},'What should “'+t.t+'” be?'));
    const o=h('div',{class:'opts'});let tw=0;
    shuffle([t.t].concat([t.fix],t.opts||[]),t.i*3+5).forEach(x=>{
      const b=h('button',{type:'button',class:'tok opt'},x);
      b.onclick=()=>{
        ctx.log('fix',{correct:x===t.fix,text:t.t+' -> '+x});
        if(x===t.fix){fix(t);return;}
        wrong++;tw++;b.classList.add('bad');b.disabled=true;
        const m=x===t.t?'↻ That is what it says now. Look for a change.':'↻ Not that one. '+(tw>=2?t.why:'Read the sentence out loud. What sounds right?');
        let f=panel.querySelector('.fb');if(!f){f=h('div',{class:'fb try'});panel.append(f);}f.textContent=m;
      };
      o.append(b);
    });
    panel.append(o);
  }
  let first=true;
  toks.forEach(t=>{
    const b=h('button',{type:'button',class:'etok'},t.t);b.onclick=()=>open(t);btns.push(b);
    if(!first)pass.append(' ');pass.append(b);first=false;
  });
  upd();
  function reveal(){toks.forEach(t=>{if(t.fix!=null&&!t.fixed){t.fixed=true;fixed++;const b=btns[t.i];b.textContent=t.fix;b.className='etok fixed';}});upd();panel.hidden=true;
    fb.className='fb ok';fb.innerHTML='';fb.append('Here is the corrected copy:');const clean=toks.map(t=>t.fix!=null?t.fix:t.t).join(' ');fb.append(h('div',{class:'preview'},clean),say(clean));}
  const el=h('div',null,h('p',{class:'sub'},'Read it out loud. Tap any word or part that needs a fix.'),h('div',{class:'actions'},say(s.tokens.map(t=>t.t).join(' '),'Listen to the passage'),count),pass,panel,fb);
  return{el,reveal};
};

T.write=(s,ctx)=>{
  let ci=0;const cfg=()=>Object.assign({},s,s.choose?s.choose[ci]:{});
  const used=new Set();let tab=0;
  const ta=h('textarea',{class:'ta',rows:4,'aria-label':'Write your answer here',placeholder:'Write here…'});
  const wc=h('div',{class:'wc'});const fb=h('div',{class:'fb',role:'status','aria-live':'polite'});
  const body=h('div'),chooseRow=h('div',{class:'tabs',role:'group','aria-label':'Choose one'}),modelBox=h('div',{class:'model',hidden:true});
  const words=()=>ta.value.trim().split(/\s+/).filter(w=>w&&!/^_+[.,!?;:]*$/.test(w)).length;
  function upd(){const c=cfg();wc.textContent=words()+' words'+(c.min?' (goal: '+c.min+' or more)':'');}
  ta.oninput=upd;
  function chooseDraw(){
    chooseRow.innerHTML='';if(!s.choose)return;
    chooseRow.append(h('span',{class:'sub',style:'flex-basis:100%;margin:0'},s.choosePrompt||'Pick one:'));
    s.choose.forEach((o,k)=>{const b=h('button',{type:'button',class:'tab'+(k===ci?' sel':''),'aria-pressed':k===ci?'true':'false'},o.k);b.onclick=()=>{ci=k;tab=0;used.clear();modelBox.hidden=true;chooseDraw();drawBody();upd();};chooseRow.append(b);});
  }
  function drawBody(){
    const c=cfg();body.innerHTML='';
    if(c.sentence)body.append(h('div',{class:'sentcard'},h('div',{class:'big',html:c.sentence}),say(c.sentence)));
    if(c.tabs&&c.tabs.length){
      body.append(h('p',{class:'sub'},c.tabsTitle||'Idea tabs: tap a tab, then tap an idea to add it.'));
      const tabRow=h('div',{class:'tabs',role:'tablist'}),chipRow=h('div',{class:'chips'}),tog=h('div',{class:'actions'});
      const dr=()=>{
        tabRow.innerHTML='';chipRow.innerHTML='';tog.innerHTML='';
        c.tabs.forEach((t,k)=>{const u=used.has(t.k);const b=h('button',{type:'button',role:'tab','aria-selected':k===tab?'true':'false',class:'tab'+(k===tab?' sel':'')+(u?' used':'')},(t.e?t.e+' ':'')+t.k+(u?' ✓':''));b.onclick=()=>{tab=k;dr();};tabRow.append(b);});
        const t=c.tabs[tab];
        if(t.tip)chipRow.append(h('p',{class:'tip',html:t.tip}));
        (t.chips||[]).forEach(x=>{const b=h('button',{type:'button',class:'chipbtn'},x);b.onclick=()=>{insertAt(ta,x);used.add(t.k);dr();};chipRow.append(b);});
        if(c.need)tog.append(h('button',{type:'button',class:'btn small',onclick:()=>{if(used.has(t.k))used.delete(t.k);else used.add(t.k);dr();}},used.has(t.k)?'✓ I used this detail':'I used this detail'),h('span',{class:'count'},'Details used: '+used.size+' (goal: '+c.need+')'));
      };
      dr();body.append(tabRow,chipRow,tog);
    }
    if(c.frames&&c.frames.length){
      body.append(h('p',{class:'sub'},'Sentence frames: tap one to start.'));
      const fr=h('div',{class:'chips'});
      c.frames.forEach(f=>{const b=h('button',{type:'button',class:'chipbtn frame'},f);b.onclick=()=>insertAt(ta,f);fr.append(b);});
      body.append(fr);
    }
  }
  function showModel(){const c=cfg();modelBox.hidden=false;modelBox.innerHTML='';modelBox.append(h('b',null,'Model answer: '),h('span',{html:c.model||''}),' ',say(c.model||''));}
  function finish(){
    const c=cfg();const need=c.need||0;const min=c.min||5;
    ctx.log('write',{correct:!(/_{2,}/.test(ta.value)||words()<min||(need&&used.size<need)),text:(c.k?c.k+': ':'')+ta.value,wc:words()});
    if(/_{2,}/.test(ta.value)){fb.className='fb try';fb.textContent='↻ Replace each ___ with your own words, then press finished.';return;}
    if(words()<min){fb.className='fb try';fb.textContent='↻ Keep going — write at least '+min+' words. Use a sentence frame if you need a start.';return;}
    if(need&&used.size<need){fb.className='fb try';fb.textContent='↻ Add more detail — try '+(need-used.size)+' more idea'+(need-used.size>1?'s':'')+' from the tabs.';return;}
    fb.className='fb ok';fb.textContent='✓ Nice writing! Click “Hear it” to check how it sounds, then press Next.';ctx.done(1);
  }
  chooseDraw();drawBody();upd();
  const el=h('div',null,chooseRow,body,h('label',{class:'sub',for:'wa'},'Your writing'),ta,wc,
    h('div',{class:'actions'},
      h('button',{class:'btn small',type:'button',onclick:()=>speak(ta.value||'You have not written anything yet.')},'🔊 Hear it'),
      h('button',{class:'btn small',type:'button',onclick:showModel},'👀 See a model'),
      h('button',{class:'btn primary',type:'button',onclick:finish},'I’m finished')),
    modelBox,fb);
  ta.id='wa';
  return{el,reveal:showModel};
};

T.replace=(s,ctx)=>{
  const need=s.need||2;const boxed=new Set(),repl={};
  const sent=h('p',{class:'bigsent'}),tray=h('div'),prev=h('div',{class:'preview',hidden:true}),fb=h('div',{class:'fb',role:'status','aria-live':'polite'});
  const chunkKeys=[];s.parts.forEach((p,i)=>{if(typeof p!=='string')chunkKeys.push(i);});
  function text(){return s.parts.map((p,i)=>typeof p==='string'?p:(repl[i]||p.w)).join('');}
  function draw(){
    sent.innerHTML='';
    s.parts.forEach((p,i)=>{
      if(typeof p==='string'){sent.append(p);return;}
      const r=repl[i];
      const b=h('button',{type:'button',class:'tok m-box'+(boxed.has(i)?' on':''),'aria-pressed':boxed.has(i)?'true':'false'},r||p.w);
      if(r)b.classList.add('good');
      b.onclick=()=>{if(boxed.has(i)){boxed.delete(i);delete repl[i];}else boxed.add(i);fb.textContent='';draw();};
      sent.append(b);
    });
    tray.innerHTML='';
    const bx=[...boxed].sort((a,b)=>a-b);
    tray.append(h('p',{class:'count'},'Words boxed: '+bx.length+' (goal: '+need+' or more)'));
    bx.forEach(i=>{
      const p=s.parts[i];
      const row=h('div',{class:'trayrow'},h('div',{class:'sub',style:'margin:0 0 .4rem'},'Replace “'+p.w+'” with a more exciting choice:'));
      const ch=h('div',{class:'chips'});
      p.opts.forEach(o=>{const b=h('button',{type:'button',class:'chipbtn'+(repl[i]===o?' on':'')},o);b.onclick=()=>{repl[i]=o;draw();};ch.append(b);});
      row.append(ch);
      const inp=h('input',{class:'rin',type:'text','aria-label':'Or write your own replacement for '+p.w,placeholder:'Or type your own exciting word…',value:repl[i]&&!p.opts.includes(repl[i])?repl[i]:''});
      inp.oninput=()=>{if(inp.value.trim())repl[i]=inp.value.trim();else delete repl[i];prev.textContent=text();};
      row.append(inp);tray.append(row);
    });
    const n=Object.keys(repl).length;prev.hidden=!n;prev.textContent=text();
  }
  function finish(){
    const n=Object.keys(repl).length;
    ctx.log('check',{correct:n>=need,text:text(),wc:wcount(text())});
    if(n<need){fb.className='fb try';fb.textContent='↻ Box at least '+need+' dull words and replace them. You have replaced '+n+'.';return;}
    fb.className='fb ok';fb.innerHTML='';fb.append('✓ Great upgrade! Read your new sentence out loud: ',h('b',null,text()));ctx.done(1);
  }
  function reveal(){
    chunkKeys.slice(0,Math.max(need,2)).forEach(i=>{boxed.add(i);repl[i]=s.parts[i].opts[0];});
    draw();fb.className='fb ok';fb.textContent='Here is one way to upgrade it.';
  }
  draw();
  const el=h('div',null,h('p',{class:'sub'},'1. Tap the dull words to box them. 2. Choose an exciting replacement.'),sent,tray,
    h('p',{class:'sub'},'Your new sentence:'),prev,
    h('div',{class:'card frame',style:'border-style:dashed'},h('b',null,'Sentence frame: '),s.frame||'I replaced ___ with ___ because it sounds more ___.'),
    h('div',{class:'actions'},h('button',{class:'btn small',type:'button',onclick:()=>speak(text())},'🔊 Hear it'),h('button',{class:'btn primary',type:'button',onclick:finish},'I’m finished')),fb);
  return{el,reveal};
};

T.draw=(s,ctx)=>{
  let ci=0;const cfg=()=>Object.assign({},s,s.choose?s.choose[ci]:{});
  const cv=h('canvas',{width:760,height:420,role:'img','aria-label':'Drawing area. Draw with your finger or mouse.'});
  const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.lineCap='round';g.lineJoin='round';
  let color='#14213D',size=6,stamp=null,drawing=false,hist=[];
  const colors=[['#14213D','Black'],['#C62828','Red'],['#1565C0','Blue'],['#2E7D32','Green'],['#F9A825','Yellow'],['#6A2FB0','Purple'],['#8D5524','Brown']];
  function snap(){hist.push(g.getImageData(0,0,cv.width,cv.height));if(hist.length>25)hist.shift();}
  function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};}
  cv.addEventListener('pointerdown',e=>{
    e.preventDefault();const p=pos(e);snap();
    if(stamp){g.font='72px serif';g.textAlign='center';g.textBaseline='middle';g.fillStyle='#000';g.fillText(stamp,p.x,p.y);return;}
    drawing=true;try{cv.setPointerCapture(e.pointerId);}catch(err){}
    g.strokeStyle=color;g.lineWidth=size;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x+.1,p.y);g.stroke();
  });
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);g.lineTo(p.x,p.y);g.stroke();});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,()=>{drawing=false;}));
  const tools=h('div',{class:'dtools',role:'toolbar','aria-label':'Drawing tools'});
  function drawTools(){
    tools.innerHTML='';
    colors.forEach(([c,n])=>{const b=h('button',{type:'button',class:'swatch'+(color===c&&!stamp?' sel':''),style:'background:'+c,'aria-label':n+' pen'});b.onclick=()=>{color=c;stamp=null;size=size>=20?6:size;drawTools();};tools.append(b);});
    [['Thin',3],['Medium',7],['Thick',14]].forEach(([n,v])=>{const b=h('button',{type:'button',class:'tbtn dt'+(size===v&&!stamp?' on':'')},n);b.onclick=()=>{size=v;stamp=null;if(color==='#fff')color='#14213D';drawTools();};tools.append(b);});
    const er=h('button',{type:'button',class:'tbtn dt'+(color==='#fff'?' on':'')},'Eraser');er.onclick=()=>{color='#fff';size=24;stamp=null;drawTools();};tools.append(er);
    tools.append(h('button',{type:'button',class:'tbtn',onclick:()=>{const p=hist.pop();if(p)g.putImageData(p,0,0);}},'Undo'));
    tools.append(h('button',{type:'button',class:'tbtn',onclick:()=>{snap();g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);}},'Clear'));
  }
  const stampRow=h('div',{class:'dtools',role:'toolbar','aria-label':'Stickers'});
  function drawStamps(){
    stampRow.innerHTML='';
    (s.stamps||[]).forEach(x=>{const b=h('button',{type:'button',class:'tok stamp'+(stamp===x?' on':''),'aria-label':'Sticker '+x},x);b.onclick=()=>{stamp=(stamp===x)?null:x;drawStamps();drawTools();};stampRow.append(b);});
  }
  const chooseRow=h('div',{class:'tabs',role:'group'}),prompt=h('div');
  function chooseDraw(){
    chooseRow.innerHTML='';if(!s.choose)return;
    chooseRow.append(h('span',{class:'sub',style:'flex-basis:100%;margin:0'},s.choosePrompt||'Pick one:'));
    s.choose.forEach((o,k)=>{const b=h('button',{type:'button',class:'tab'+(k===ci?' sel':''),'aria-pressed':k===ci?'true':'false'},o.k);b.onclick=()=>{ci=k;chooseDraw();dp();};chooseRow.append(b);});
  }
  function dp(){const c=cfg();prompt.innerHTML='';if(c.sentence)prompt.append(h('div',{class:'sentcard'},h('div',{class:'big',html:c.sentence}),say(c.sentence)));}
  const cap=h('input',{class:'rin',type:'text','aria-label':'Write a label or caption',placeholder:s.caption||'Write a label or caption…'});
  chooseDraw();dp();drawTools();drawStamps();
  function save(){cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(C.id||'drawing')+'.png';a.click();});}
  const el=h('div',null,chooseRow,prompt,h('p',{class:'sub'},'Pick a pen or a sticker. Tap a sticker, then tap the picture to place it.'),stampRow,tools,cv,
    h('p',{class:'sub'},s.captionLabel||'Add a label:'),cap,
    h('div',{class:'actions'},h('button',{class:'btn small',type:'button',onclick:save},'💾 Save picture'),h('button',{class:'btn primary',type:'button',onclick:()=>{ctx.log('draw',{correct:true,text:(cfg().k?cfg().k+': ':'')+cap.value,wc:wcount(cap.value)});ctx.done(1);}},'I’m finished')));
  return{el,reveal:()=>{}};
};

/* ---------- stages ---------- */
const stages=[{k:'warm'},{k:'lesson'}].concat(C.steps.map((s,i)=>({k:'step',s:s,i:i}))).concat([{k:'wrap'}]);
const S={i:0,stars:0,done:{}};
const stageEl=h('main',{id:'stage',tabindex:'-1'});
const nav=h('nav',{class:'nav','aria-label':'Page navigation'});
const prog=h('div',{class:'progress'});

function complete(i,n){
  if(!S.done[i]){S.done[i]={stars:n};S.stars+=n;log('step-complete',{section:'step'+(i+1)+'-'+C.steps[i].type,item:i+1,correct:n>0,stars:S.stars,text:n>0?'earned a star':'finished with help'});}
  const b=$('#nextBtn');if(b)b.disabled=false;
  const bn=$('.banner');if(bn)bn.hidden=false;
  drawProgress();
}
function drawProgress(){
  prog.innerHTML='';
  const ul=h('ol',{class:'dots','aria-label':'Progress'});
  stages.forEach((st,i)=>{
    const d=(st.k==='step'&&S.done[st.i])||i<S.i;
    ul.append(h('li',{class:'dot'+(d?' done':'')+(i===S.i?' now':''),'aria-current':i===S.i?'step':false}));
  });
  const st=stages[S.i];
  const lab=st.k==='warm'?'Warm-up':st.k==='lesson'?'Learn it':st.k==='step'?'Practice: step '+(st.i+1)+' of '+C.steps.length:'All done';
  prog.append(ul,h('p',{class:'plabel'},lab));
}
function drawNav(){
  nav.innerHTML='';const st=stages[S.i];
  nav.append(h('button',{class:'btn',type:'button',disabled:S.i===0,onclick:()=>go(S.i-1)},'← Back'));
  if(st.k==='wrap'){nav.append(h('a',{class:'btn primary',href:'index.html'},'All activities'));return;}
  const label=st.k==='warm'?'Let’s learn':st.k==='lesson'?'Start practice':(S.i===stages.length-2?'Finish':'Next');
  const can=st.k!=='step'||!!S.done[st.i];
  nav.append(h('button',{class:'btn primary',id:'nextBtn',type:'button',disabled:!can,onclick:()=>go(S.i+1)},label+' →'));
}
function go(n){if(n>0&&!S.started){S.started=true;log('start',{section:'warmup',text:C.title});}S.i=Math.max(0,Math.min(stages.length-1,n));render();}

function warmView(){
  const w=C.warm;const v=h('div');
  v.append(h('p',{class:'kicker'},'Warm-up: what do I already know?'),h('div',{class:'qrow'},h('h1',{class:'ttl'},w.title),say(w.title+'. '+plain(w.intro||''))));
  if(w.intro)v.append(h('p',{class:'lead',html:w.intro}));
  const sc=h('div',{class:'scene-grid'});
  w.scene.forEach(x=>{
    const th=h('span',{class:'think',hidden:true,html:x.think||''});
    const b=h('button',{type:'button',class:'scene','aria-expanded':'false'},h('span',{class:'emo','aria-hidden':'true'},x.e),h('b',{html:x.label}),th);
    b.onclick=()=>{const open=th.hidden;th.hidden=!open;b.setAttribute('aria-expanded',open?'true':'false');if(open)speak(plain(x.label+'. '+(x.think||'')));};
    sc.append(b);
  });
  v.append(sc);
  if(w.poll){
    const pl=h('div',{class:'card'});pl.append(h('h3',{html:w.poll.q}));
    const pm=h('p',{class:'fb',role:'status','aria-live':'polite'});const ob=h('div',{class:'opts'});
    w.poll.opts.forEach(o=>{const b=h('button',{type:'button',class:'tok opt m-box',html:o.t});b.onclick=()=>{ob.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));b.classList.add('on');pm.innerHTML=o.msg||'';speak(plain(o.msg||''));log('poll',{section:'warmup',text:plain(w.poll.q)+' => '+plain(o.t)});};ob.append(b);});
    pl.append(ob,pm);v.append(pl);
  }
  if(w.talk){
    const tk=h('div',{class:'card'});tk.append(h('h3',{html:'🗣️ '+w.talk.q}));
    const ta=h('textarea',{class:'ta',rows:3,'aria-label':'Write or plan what you will say',placeholder:'Turn and talk, or write your idea here…'});
    const fr=h('div',{class:'chips'});
    (w.talk.frames||[]).forEach(f=>{const b=h('button',{type:'button',class:'chipbtn frame'},f);b.onclick=()=>insertAt(ta,f);fr.append(b);});
    ta.addEventListener('blur',()=>{if(ta.value.trim())log('warmup-talk',{section:'warmup',text:ta.value,wc:wcount(ta.value)});});
    tk.append(h('p',{class:'sub'},'Sentence frames: tap one to start.'),fr,ta);v.append(tk);
  }
  return v;
}
function lessonView(){
  const v=h('div');
  v.append(h('p',{class:'kicker'},'Learn it'),h('h1',{class:'ttl'},C.lesson.title));
  C.lesson.cards.forEach(c=>{
    const exs=(c.ex||[]);
    v.append(h('section',{class:'card lesson'},h('div',{class:'icon','aria-hidden':'true'},c.icon),
      h('div',{class:'lbody'},h('h2',{html:c.head}),h('div',{html:c.body}),exs.map(e=>h('div',{class:'ex',html:e})),say(c.head+'. '+plain(c.body)+' '+exs.map(plain).join('. ')))));
  });
  return v;
}
function stepView(st){
  const s=st.s;const v=h('div');
  v.append(h('p',{class:'stepno'},'Step '+(st.i+1)+' of '+C.steps.length),h('div',{class:'qrow'},h('h2',{class:'q',html:s.q}),say(s.q)));
  if(s.note)v.append(h('p',{class:'lead',html:s.note}));
  const banner=h('div',{class:'banner',role:'status',hidden:!S.done[st.i]},'✓ Step complete. Press Next when you are ready.');
  const L=(ev,o)=>log(ev,Object.assign({section:'step'+(st.i+1)+'-'+s.type,item:st.i+1},o));
  const api=T[s.type](s,{done:n=>complete(st.i,n),log:L});
  const hint=h('div',{class:'hint',hidden:true,html:'💡 '+(s.hint||'Read the directions again. Take your time. You can use Listen.')});
  v.append(api.el,banner,h('div',{class:'help'},
    h('button',{class:'btn small',type:'button',onclick:()=>{hint.hidden=!hint.hidden;if(!hint.hidden)L('hint',{text:'hint opened'});}},'💡 Hint'),
    h('button',{class:'btn small',type:'button',onclick:()=>{L('show-me',{text:'answers revealed'});api.reveal&&api.reveal();complete(st.i,0);}},'👀 Show me')),hint);
  return v;
}
function wrapView(){
  const n=C.steps.length;const pct=n?S.stars/n:0;
  const msg=pct>=.8?'You’ve got this skill. Great work!':pct>=.5?'You’re getting there. Try the activity once more to make it stronger.':'This skill is still growing, and that is okay. Try it again and use the hints.';
  const v=h('div');
  v.append(h('p',{class:'kicker'},'All done'),h('div',{class:'qrow'},h('h1',{class:'ttl'},'Reflect and grow'),say(msg)));
  if(!S.fin){S.fin=true;log('finish',{section:'wrap',stars:S.stars,text:S.stars+' of '+n+' stars'});}
  const stars=h('div',{class:'stars','aria-label':S.stars+' of '+n+' stars'});
  for(let i=0;i<n;i++)stars.append(h('span',{class:'star'+(i<S.stars?' on':''),'aria-hidden':'true'},'★'));
  v.append(h('div',{class:'card'},h('h3',null,'You earned '+S.stars+' of '+n+' stars'),stars,h('p',null,msg)));
  const rf=h('div',{class:'card'});rf.append(h('h3',null,'What skill do I need to keep practicing?'));
  const ta=h('textarea',{class:'ta',rows:3,'aria-label':'Reflection',placeholder:'Write your reflection here…'});
  const ch=h('div',{class:'chips'});
  (C.wrap.skills||[]).forEach(x=>{const b=h('button',{type:'button',class:'chipbtn'},x);b.onclick=()=>insertAt(ta,x);ch.append(b);});
  const fr=h('div',{class:'chips'});
  ['I want to practice ___ because ___.','I felt confident about ___.','I still have a question about ___.'].forEach(f=>{const b=h('button',{type:'button',class:'chipbtn frame'},f);b.onclick=()=>insertAt(ta,f);fr.append(b);});
  rf.append(h('p',{class:'sub'},'Tap a skill to add it:'),ch,h('p',{class:'sub'},'Sentence frames:'),fr,ta);
  const saved=h('div',{class:'fb',role:'status','aria-live':'polite'});
  rf.append(h('div',{class:'actions'},h('button',{class:'btn primary',type:'button',onclick:()=>{
    if(!ta.value.trim()){saved.className='fb try';saved.textContent='↻ Write your reflection first.';return;}
    log('reflection',{section:'wrap',stars:S.stars,text:ta.value,wc:wcount(ta.value)});saved.className='fb ok';saved.textContent='✓ Saved. Your teacher can see this.';}},'Save my reflection')),saved);
  v.append(rf,h('div',{class:'actions'},h('button',{class:'btn',type:'button',onclick:()=>{S.i=0;S.stars=0;S.done={};S.fin=false;S.started=false;render();}},'↻ Practice again')));
  return v;
}
function render(){
  try{window.speechSynthesis.cancel();}catch(e){}
  const st=stages[S.i];stageEl.innerHTML='';
  stageEl.append(st.k==='warm'?warmView():st.k==='lesson'?lessonView():st.k==='step'?stepView(st):wrapView());
  drawProgress();drawNav();window.scrollTo(0,0);
}

/* ---------- chrome ---------- */
function tb(label,fn,id){return h('button',{type:'button',class:'tbtn',id:id||false,onclick:fn},label);}
const header=h('header',{class:'top'},h('div',{class:'chev','aria-hidden':'true'},h('i'),h('i'),h('i')),
  h('div',{class:'brand'},h('div',{class:'small'},'Do Now practice'),h('h1',{class:'site'},C.emoji+' '+C.title)));
const tools=h('div',{class:'tools',role:'toolbar','aria-label':'Reading supports'},
  tb('A−',()=>{P.bump=Math.max(-2,P.bump-2);applyPrefs();}),
  tb('A+',()=>{P.bump=Math.min(8,P.bump+2);applyPrefs();}),
  tb('Wider spacing',()=>{P.spacing=!P.spacing;applyPrefs();},'t-sp'),
  tb('High contrast',()=>{P.contrast=!P.contrast;applyPrefs();},'t-co'));
const nameIn=h('input',{id:'sn',class:'rin idin',type:'text',autocomplete:'off',placeholder:'Type your name',value:ID.name||''});
const perIn=h('input',{id:'sp',class:'rin idin per',type:'text',autocomplete:'off',inputmode:'numeric',maxlength:'4',placeholder:'Period',value:ID.period||''});
function idState(){idbar.classList.toggle('need',!ID.name);}
nameIn.addEventListener('input',()=>{ID.name=nameIn.value.trim();saveID();idState();});
perIn.addEventListener('input',()=>{ID.period=perIn.value.trim();saveID();});
const idbar=h('div',{class:'idbar',role:'group','aria-label':'Student information'},
  h('label',{for:'sn'},'Name'),nameIn,h('label',{for:'sp'},'Period'),perIn,
  h('button',{type:'button',class:'tbtn',onclick:()=>{ID.name='';ID.period='';saveID();nameIn.value='';perIn.value='';idState();S.i=0;S.stars=0;S.done={};S.fin=false;S.started=false;render();}},'New student'));
idState();
document.documentElement.style.setProperty('--c',C.c);document.documentElement.style.setProperty('--t',C.t);
$('#app').append(header,tools,idbar,prog,stageEl,nav);
applyPrefs();render();
})();

</script>
